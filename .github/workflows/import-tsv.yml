name: Import DHSJR Data to Supabase

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'バッチサイズ (Batch size)'
        required: false
        default: '1000'
      operation:
        description: '実行モード (Operation mode)'
        required: true
        type: choice
        options:
          - preflight
          - staging
          - production
        default: preflight
      production_confirmation:
        description: '本番実行時のみ IMPORT_PRODUCTION と入力'
        required: false
        default: ''

jobs:
  import-dhsjr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL_ENV: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY_ENV: ${{ secrets.SUPABASE_SERVICE_KEY }}
      IMPORT_OPERATION: ${{ inputs.operation }}
      INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
      PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}

    steps:
      - name: 📥 チェックアウト (Checkout)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐍 Python セットアップ (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 依存関係インストール (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 📊 ファイル確認 (Check file)
        run: |
          if [ ! -f "DHSJR_data_all.tsv" ]; then
            echo "❌ エラー: DHSJR_data_all.tsv が見つかりません"
            exit 1
          fi
          echo "✅ ファイル確認完了"
          ls -lh DHSJR_data_all.tsv
          echo "📝 行数: $(wc -l < DHSJR_data_all.tsv)"

      - name: 🔎 TSV事前検証 (Preflight validation)
        run: |
          python scripts/import_dhsjr.py \
            --batch-size "$INPUT_BATCH_SIZE" \
            --preflight-only

      - name: 🎯 インポート先選択 (Select target)
        if: ${{ inputs.operation != 'preflight' }}
        run: |
          case "$IMPORT_OPERATION" in
            staging)
              echo "TARGET_TABLE=dhsjr_staging" >> "$GITHUB_ENV"
              ;;
            production)
              if [ "$PRODUCTION_CONFIRMATION" != "IMPORT_PRODUCTION" ]; then
                echo "❌ production 実行には IMPORT_PRODUCTION の確認入力が必要です"
                exit 1
              fi
              echo "TARGET_TABLE=dhsjr" >> "$GITHUB_ENV"
              ;;
            *)
              echo "❌ 未対応の実行モード: $IMPORT_OPERATION"
              exit 1
              ;;
          esac

      - name: 🚀 データインポート (Import data)
        if: ${{ inputs.operation != 'preflight' }}
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/import_dhsjr.py \
            --batch-size "$INPUT_BATCH_SIZE" \
            --table "$TARGET_TABLE"

      - name: 📊 インポート結果確認 (Verify import)
        if: ${{ inputs.operation != 'preflight' }}
        run: |
          python -c "
          import os, sys; sys.path.insert(0, 'scripts')
          from common import create_supabase_client
          from import_dhsjr import get_file_info
          supabase = create_supabase_client()
          table_name = os.environ['TARGET_TABLE']
          _, expected_count = get_file_info('DHSJR_data_all.tsv')
          result = supabase.table(table_name).select('ID', count='exact').limit(1).execute()
          print(f'📊 {table_name}: {result.count:,} 行 (期待値: {expected_count:,} 行)')
          if result.count != expected_count:
              raise SystemExit('❌ インポート後の行数が期待値と一致しません')
          print('✅ インポート後の行数を確認しました')
          "

      - name: 📤 ログアップロード (Upload logs on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs
          path: '*.log'
          retention-days: 7

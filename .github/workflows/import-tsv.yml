name: Import DHSJR Data to Supabase

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'バッチサイズ (Batch size)'
        required: false
        default: '1000'
      skip_clear:
        description: 'テーブルクリアをスキップする (Skip table clear)'
        required: false
        type: boolean
        default: false

jobs:
  import-dhsjr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL_ENV: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY_ENV: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: 📥 チェックアウト (Checkout)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐍 Python セットアップ (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 依存関係インストール (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 📊 ファイル確認 (Check file)
        run: |
          if [ ! -f "DHSJR_data_all.tsv" ]; then
            echo "❌ エラー: DHSJR_data_all.tsv が見つかりません"
            exit 1
          fi
          echo "✅ ファイル確認完了"
          ls -lh DHSJR_data_all.tsv
          echo "📝 行数: $(wc -l < DHSJR_data_all.tsv)"

      - name: 🚀 データインポート (Import data)
        working-directory: ${{ github.workspace }}
        run: |
          ARGS="--batch-size ${{ github.event.inputs.batch_size || '1000' }}"
          if [ "${{ github.event.inputs.skip_clear }}" = "true" ]; then
            ARGS="$ARGS --no-clear"
          fi
          python scripts/import_dhsjr.py $ARGS

      - name: 📊 インポート結果確認 (Verify import)
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from common import create_supabase_client
          supabase = create_supabase_client()
          result = supabase.table('dhsjr').select('*', count='exact').limit(1).execute()
          print(f'✅ テーブル内の総行数: {result.count:,} 行')
          "

      - name: 📤 ログアップロード (Upload logs on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs
          path: '*.log'
          retention-days: 7
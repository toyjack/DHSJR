name: Import DHSJR Data to Supabase

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'バッチサイズ (Batch size)'
        required: false
        default: '1000'
      clear_table:
        description: 'テーブルをクリアする (Clear table before import)'
        required: false
        type: boolean
        default: false
  
  # 或者在文件更新时自动触发
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'DHSJR_data_all.tsv'

jobs:
  import-dhsjr:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时
    
    steps:
      - name: 📥 チェックアウト (Checkout)
        uses: actions/checkout@v4
        with:
          lfs: true  # 如果使用 Git LFS
      
      - name: 🐍 Python セットアップ (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 依存関係インストール (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📊 ファイル確認 (Check file)
        run: |
          if [ ! -f "DHSJR_data_all.tsv" ]; then
            echo "❌ エラー: DHSJR_data_all.tsv が見つかりません"
            exit 1
          fi
          echo "✅ ファイル確認完了"
          echo "📁 ファイルサイズ:"
          ls -lh DHSJR_data_all.tsv
          echo ""
          echo "📝 行数:"
          wc -l DHSJR_data_all.tsv
          echo ""
          echo "📋 ヘッダー確認:"
          head -1 DHSJR_data_all.tsv
      
      - name: 🗑️ テーブルクリア (Clear table - optional)
        if: ${{ github.event.inputs.clear_table == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          try:
              # 删除所有数据但保留表结构
              supabase.table('dhsjr').delete().neq('id', 0).execute()
              print('✅ テーブルをクリアしました')
          except Exception as e:
              print(f'⚠️  クリア警告: {str(e)}')
          "
      
      - name: 🚀 データインポート (Import data)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '1000' }}
        run: |
          python scripts/import_dhsjr.py
      
      - name: 📊 インポート結果確認 (Verify import)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          result = supabase.table('dhsjr').select('*', count='exact').limit(1).execute()
          print(f'✅ テーブル内の総行数: {result.count:,} 行')
          "
      
      - name: 📤 ログアップロード (Upload logs on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs
          path: |
            *.log
          retention-days: 7

      - name: 💬 成功通知 (Success notification)
        if: success()
        run: |
          echo "🎉 DHSJR データのインポートが正常に完了しました!"